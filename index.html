* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {

a { color:inherit; text-decoration:none; }

}
.btn:hover { filter:brightness(1.18); transform:translateY(-2px); }

.hero { min-height:590px; display:grid; align-items:center; position:relative; overflow:hidden; border-bottom:1px solid #ffffff12; }

.hero-art { position:absolute; right:-4%; top:8%; width:56%; height:84%; opacity:.65; background:radial-gradient(ellipse at 55% 45%,#a27aff55 0,transparent 42%); clip-path:polygon(50% 0,100% 20%,85% 100%,20% 85%,0 25%); }

.actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:30px; }
.scroll-note { margin-top:48px; color:#766d8d; font-size:10px; letter-spacing:.22em; }
section { padding:86px 0; }

.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }

.roster { grid-template-columns:repeat(4,1fr); }
.member { padding:20px; text-align:center; }

.member h3 { margin:0; }
.member small { color:var(--violet2); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
.notice { border-left:2px solid var(--violet); padding:16px 18px; background:#171329; color:#c9c2d9; font-size:13px; }
.join { background:linear-gradient(110deg,#1b1430,#0f0d19); border:1px solid var(--line); padding:42px; display:flex; align-items:center; justify-content:space-between; gap:24px; }

footer { border-top:1px solid #ffffff14; padding:28px 0; color:#817a94; font-size:11px; }
